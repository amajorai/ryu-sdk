        "404": { $ref: "#/components/responses/NotFound" }
  /v1/embeddings:
    post:
      tags: [Inference]
      summary: Create embeddings
      description: |
        OpenAI-compatible embeddings, routed through the governed pipeline. The
        Gateway resolves `model` through its routing table; callers never send an
        upstream URL or key. `input` is a string or an array of at most 256
        strings, each at most 16,384 bytes of UTF-8 (bytes, not characters: CJK
        text takes about three bytes per character). A longer input answers 400.
      operationId: createEmbedding
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/AgentIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, minLength: 1 }
                input:
                  oneOf:
                    - { type: string, description: At most 16384 UTF-8 bytes. }
                    - type: array
                      maxItems: 256
                      items: { type: string, description: At most 16384 UTF-8 bytes. }
              required: [model, input]
              additionalProperties: true
      responses:
        "200":
          description: The provider's OpenAI-shaped embedding list.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            x-provider:
              description: Upstream provider that served the request.
              schema: { type: string }
            x-routed-model:
              description: Model selected after routing.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        object: { type: string, const: embedding }
                        index: { type: integer }
                        embedding: { type: array, items: { type: number } }
                  model: { type: string }
                  usage: { $ref: "#/components/schemas/Usage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/rerank:
    post:
      tags: [Inference]
      summary: Rerank documents
      description: |
        Score `documents` against `query` through the governed pipeline. At most
        128 documents; the query and each document are at most 32,768 bytes of
        UTF-8 (bytes, not characters). A longer input answers 400.
      operationId: createRerank
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/AgentIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, minLength: 1 }
                query: { type: string, minLength: 1, description: At most 32768 UTF-8 bytes. }
                documents:
                  type: array
                  maxItems: 128
                  items: { type: string, description: At most 32768 UTF-8 bytes. }
              required: [model, query, documents]
              additionalProperties: true
      responses:
        "200":
          description: The provider's rerank result.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            x-provider:
              description: Upstream provider that served the request.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/messages:
    post:
      tags: [Inference]
      summary: Create an Anthropic Messages response
      description: |
        Anthropic Messages dialect, translated into the governed pipeline and
        answered in Anthropic's wire format, so Anthropic-dialect clients can use
        the Gateway as their base URL. Set `stream: true` for Anthropic SSE events.
        The key may be sent as `Authorization: Bearer <key>` or `x-api-key`.
      operationId: createAnthropicMessage
      security:
        - bearerAuth: []
        - anthropicApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string }
                max_tokens: { type: integer }
                system: {}
                messages: { type: array, items: { type: object, additionalProperties: true } }
                stream: { type: boolean, default: false }
              required: [model, messages]
              additionalProperties: true
      responses:
        "200":
          description: An Anthropic `message` object, or an SSE stream when `stream` is true.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            x-routed-model:
              description: Model selected after routing.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
                description: Anthropic Messages stream events.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1beta/models/{spec}:
    post:
      tags: [Inference]
      summary: Gemini generateContent
      description: |
        Google Gemini dialect. `spec` is `<model>:generateContent` or
        `<model>:streamGenerateContent` (an SSE stream). The model comes from the
        path. The key may be sent as `Authorization: Bearer <key>`,
        `x-goog-api-key`, or the `key` query parameter.
      operationId: geminiGenerateContent
      security:
        - bearerAuth: []
        - googApiKey: []
        - googApiKeyQuery: []
      parameters:
        - name: spec
          in: path
          required: true
          description: Model and operation, for example `gemini-2.0-flash:generateContent`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contents: { type: array, items: { type: object, additionalProperties: true } }
              additionalProperties: true
      responses:
        "200":
          description: A Gemini `GenerateContentResponse`, or an SSE stream for `:streamGenerateContent`.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
                description: Gemini streaming chunks.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/auth/status:
    get:
      tags: [Health]
      summary: Check a credential
      description: Verifies the bearer key without calling a provider or disclosing configuration.
      operationId: getAuthStatus
      responses:
        "200":
          description: The credential's role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    description: Whether this Gateway requires authentication (`auth.require_auth`).
                  admin: { type: boolean, description: True for the master (admin) key. }
                  trustedForwarder: { type: boolean, description: True for a trusted-forwarder key (Core's relay). }
                required: [authenticated, admin, trustedForwarder]
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/readiness:
    get:
      tags: [Health]
      summary: Signed readiness proof
      description: |
        For a supervisor that holds the master key: returns the Gateway's
        readiness (version, listener, auth mode, key fingerprints) signed with
        HMAC-SHA256 under the master key. The request must carry a 64-hex-character
        `nonce` and an `x-ryu-readiness-proof` header. The request proof and the
        response signature use different MAC inputs, so a response cannot be
        replayed as a request proof. A malformed nonce, a wrong proof, or a
        Gateway without a master key answers 401 `invalid_api_key`; only a
        missing `nonce` parameter is a 400.
      operationId: getAuthReadiness
      security: []
      parameters:
        - name: nonce
          in: query
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
        - name: x-ryu-readiness-proof
          in: header
          required: true
          description: |
            `hex(HMAC-SHA256(master_key, "ryu-gateway-readiness-request-v1:" + nonce))`,
            64 hex characters.
          schema: { type: string }
      responses:
        "200":
          description: The signed readiness document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  readiness:
                    type: object
                    properties:
                      protocol: { type: string, const: ryu-gateway-readiness-v1 }
                      version: { type: string }
                      nonce: { type: string }
                      listener: { type: string }
                      require_auth: { type: boolean }
                      inference_keys: { type: array, items: { type: string } }
                      core_keys: { type: array, items: { type: string } }
                  signature:
                    type: string
                    description: |
                      `hex(HMAC-SHA256(master_key, json(readiness)))`, where
                      `json(readiness)` is the compact JSON serialization of the
                      `readiness` object with its fields in the order listed here.
                required: [readiness, signature]
        "400":
          description: The `nonce` query parameter is missing (`invalid_request_error`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/web/search:
    post:
      tags: [Web]
      summary: Governed web search
      description: |
        A Ryu extension, not an OpenAI standard. Searches through a configured web
        provider under the caller's policy and budget. Requires a key allowed the
        web-search operation. Unknown body fields are rejected.
      operationId: webSearch
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/AgentIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query: { type: string, minLength: 1, maxLength: 400, description: At most 50 words; no control characters. }
                limit: { type: integer, minimum: 1, maximum: 10, default: 10 }
                provider: { type: string, description: A provider id from `GET /v1/web/capabilities`. }
              required: [query]
      responses:
        "200":
          description: Search results.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            x-provider:
              description: Web provider that served the request.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string, nullable: true }
                        url: { type: string }
                        snippet: { type: string }
                        score: { type: number, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/web/fetch:
    post:
      tags: [Web]
      summary: Governed web fetch
      description: |
        A Ryu extension. Fetches one public HTTP(S) URL through a configured web
        provider and returns its content. Requires a key allowed the web-fetch
        operation. Unknown body fields are rejected.
      operationId: webFetch
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/AgentIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url: { type: string, format: uri, description: A public HTTP(S) URL. }
                format: { type: string, enum: [markdown, text], default: markdown }
                provider: { type: string, description: A provider id from `GET /v1/web/capabilities`. }
              required: [url]
      responses:
        "200":
          description: Fetched page content.
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
            x-provider:
              description: Web provider that served the request.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        url: { type: string }
                        title: { type: string, nullable: true }
                        content: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/web/capabilities:
    get:
      tags: [Web]
      summary: Web providers available to this key
      description: Lists the web providers the caller's key and policy may use, and whether each is ready.
      operationId: getWebCapabilities
      responses:
        "200":
          description: Web providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        operations: { type: array, items: { type: string, enum: [search, fetch] } }
                        formats: { type: array, items: { type: string, enum: [markdown, text] } }
                        configured: { type: boolean }
                        ready: { type: boolean }
                        diagnostic: { type: string, nullable: true }
                        auth_mode: { type: string, nullable: true, enum: [anonymous, accounts, null] }
                        context_fields: { type: array, items: { type: string } }
                        sunset: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/wallet:
    get:
      tags: [Audit]
      summary: Wallet balance (admin)
      description: Requires the master key, or a loopback caller when the Gateway runs without required auth. The managed wallet balance as of the last metered call.
      operationId: getWallet
