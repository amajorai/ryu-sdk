    put:
      tags: [Config]
      summary: Update gateway config (admin)
      description: |
        Partial update. `providerAccountPolicies`, `providerAccountStrategies`, `firewall`, `budgets`, and `auth.api_keys` hot-swap;
        `routing` and provider credentials require a restart.
      operationId: putConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayConfig"
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                type: object
