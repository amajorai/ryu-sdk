openapi: 3.1.0
info:
  title: Ryu Gateway API
  version: "1.0.0"
  description: |
    The **Ryu Gateway** is the OpenAI-compatible control layer that governs every
    model call: routing, fallback, rate-limiting, firewall/PII-DLP, budgets, evals,
    and audit. Point any OpenAI-compatible client at the gateway by swapping its
    base URL; the request surface below is a superset of the OpenAI API plus Ryu's
    governance, eval, and audit endpoints.

    Authentication is via a bearer token (`Authorization: Bearer <api-key>`). When
    the gateway runs with `auth.require_auth = false`, anonymous requests are
    allowed. Admin endpoints (`/v1/config`, `/v1/audit`) additionally require the
    master key or a loopback peer.

    Every response, errors included, carries an `x-request-id` header; on a
    governed model call it matches the Gateway audit record. Browser callers on
    an allowed origin can read it, along with `Retry-After`, `RateLimit`,
    `RateLimit-Policy`, `x-provider` and `x-routed-model`.

    Errors from the shared error path use one JSON envelope,
    `{"error":{"message","type","code"}}`, where `type` and `code` are the same
    stable code (see the `ErrorCode` schema). The router uses the same envelope
    for an unmatched route (404 `not_found`), a wrong method (405
    `method_not_allowed`, with an `Allow` header), a body over the size limit
    (413 `request_too_large`), a malformed or mistyped JSON body (400, 415 or
    422 `invalid_request_error`) and the server-wide request timeout (504
    `gateway_timeout`). A few older handlers still answer their own shape:
    `/v1/evals/run` and `/v1/evals/score` validation errors are
    `{"error":"<message>"}`, and `/v1/batches` validation errors are
    `{"error":{"code":"invalid_batch_request","message"}}` with no `type`.
    Passthrough routes return the upstream body unchanged.

    An upstream provider failure is always a 502 `provider_error`, whatever
    status the provider sent; when that status is known it is in
    `error.upstream_status`.
servers:
  - url: http://localhost:7981
    description: Local gateway (default bind)
security:
  - bearerAuth: []
tags:
  - name: Inference
    description: OpenAI Chat Completions and Responses, image, and audio generation.
  - name: Models
    description: Available models and configured modalities.
  - name: Evals
    description: Provider scoring and dataset eval runs.
  - name: Batch
    description: Admin-only asynchronous OpenRouter inference jobs.
  - name: Governance
    description: Grant validation and manifest signing/verification.
  - name: Audit
    description: Usage audit log and sandbox execution governance.
  - name: Config
    description: Runtime gateway configuration (admin).
  - name: Channels
    description: Approving the senders of channel bots (Telegram, WhatsApp, Slack, Discord, iMessage).
  - name: Tools
    description: Tool integrations (Composio registry) and governed direct execution.
  - name: Security
    description: Firewall guardrail checks over caller-supplied text.
  - name: Web
    description: Governed web search and fetch (Ryu extensions, not OpenAI standards).
  - name: Health
    description: Liveness, provider status, and observability metrics.
paths:
  /v1/chat/completions:
    post:
      tags: [Inference]
      summary: Create a chat completion
      description: |
        OpenAI-compatible chat completion. Set `stream: true` to receive a
        Server-Sent Events stream of `chat.completion.chunk` objects. Per-request
        governance is driven by optional `x-ryu-*` headers (user/agent identity,
        per-agent provider/model slot overrides, session correlation).
      operationId: createChatCompletion
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/EndUserHeader"
        - $ref: "#/components/parameters/AgentIdHeader"
        - name: x-ryu-slot-chat-provider
          in: header
          required: false
          description: Per-agent chat provider override.
          schema: { type: string }
        - name: x-ryu-slot-chat-model
          in: header
          required: false
          description: Per-agent chat model override.
          schema: { type: string }
        - name: x-ryu-session-id
          in: header
          required: false
          description: Core conversation id, recorded in the audit log for correlation.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: A chat completion (or an SSE stream when `stream` is true).
          headers:
            x-request-id:
              description: Gateway request id.
              schema: { type: string }
            x-provider:
              description: Upstream provider that served the request.
              schema: { type: string }
            x-cache:
              description: Exact-cache result.
              schema: { type: string, enum: [HIT, MISS] }
            x-degraded:
              description: Set to `fallback:<provider>` when served by a fallback.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: "SSE stream of chat.completion.chunk objects (one per `data:` line)."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/agents/{agent_id}/chat/completions:
    post:
      tags: [Inference]
      summary: Create a chat completion for an agent
      description: |
        The same request and response as `POST /v1/chat/completions`, with the
        agent identity taken from the path instead of an `x-ryu-agent-id`
        header. It gives an agent process that makes its own HTTP calls an
        agent-specific base URL (`<gateway>/v1/agents/<agent_id>`), so its usage
        and budgets bind to that agent. The usual authentication rules still
        decide whether the key may act for that agent.
      operationId: createAgentChatCompletion
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The agent id, used as `x-ryu-agent-id`.
          schema: { type: string, minLength: 1 }
        - $ref: "#/components/parameters/UserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: A chat completion (or an SSE stream when `stream` is true).
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: "SSE stream of chat.completion.chunk objects (one per `data:` line)."
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/agents/{agent_id}/{agent_proof}/chat/completions:
    post:
      tags: [Inference]
      summary: Create a chat completion for a proven agent
      description: |
        Like `POST /v1/agents/{agent_id}/chat/completions`, for agent routes that
        Ryu Core manages. `agent_proof` is a route proof Core mints for its own
        Gateway key and that agent, so a caller holding another key cannot move
        spend to the agent by rewriting the path. Standalone callers use the
        route without a proof.
      operationId: createProvenAgentChatCompletion
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The agent id, used as `x-ryu-agent-id`.
          schema: { type: string, minLength: 1 }
        - name: agent_proof
          in: path
          required: true
          description: The Core-minted route proof, sent on as `x-ryu-agent-proof`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: A chat completion (or an SSE stream when `stream` is true).
          headers:
            x-request-id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: "SSE stream of chat.completion.chunk objects (one per `data:` line)."
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/responses:
    post:
      tags: [Inference]
      summary: Create a Responses API response
      description: |
        Create a response through the governed Gateway inference pipeline. Supports text and
        image-URL input, function tools and namespaces, text custom tools, bounded regex
        constraints, JSON output formats, streaming, and
        `previous_response_id` continuation. Reasoning effort, text verbosity, service tier, and
        prompt-cache hints are mapped to the shared Chat Completions pipeline. Reasoning summary
        and encrypted-reasoning include hints are accepted for Pi client compatibility, but
        reasoning items are not returned. Hosted web search uses the Gateway web service and
        requires a separate web-search operation grant. Cached-only calls never use live
        search and report unavailable when no cached backend exists. Other hosted tools,
        Lark grammar constraints, file/audio/video input, conversations,
        background responses, non-text function outputs, and response retrieval/deletion are not
        supported; their 400 errors name the supported alternative. `max_tool_calls` caps hosted
        tool calls, and `top_logprobs` or `include: [message.output_text.logprobs]` returns
        provider token logprobs on `output_text` (and on streamed text deltas). Unknown top-level request fields are rejected.
      operationId: createResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string }
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: object, additionalProperties: true }
                instructions: { type: string }
                previous_response_id: { type: string }
                prompt_cache_key: { type: string, maxLength: 64 }
                prompt_cache_retention:
                  type: string
                  enum: [in_memory, 24h]
                  deprecated: true
                service_tier: { type: string, minLength: 1 }
                stream: { type: boolean, default: false }
                store: { type: boolean, default: true }
                max_output_tokens: { type: integer, minimum: 1 }
                max_tool_calls:
                  type: integer
                  minimum: 0
                  description: >-
                    Maximum number of Gateway-hosted tool calls (hosted web search) for this
                    response. Once reached, the hosted tool is withdrawn and any further hosted
                    call is reported as a failed `web_search_call` with
                    `max_tool_calls_exceeded`. Client function and custom tool calls are
                    returned to the client and do not count.
                top_logprobs:
                  type: integer
                  minimum: 0
                  maximum: 20
                  description: >-
                    Number of most likely alternatives per output token. Implies
                    `message.output_text.logprobs`. When the routed provider returns no token
                    logprobs the response fails instead of returning text without them.
                tools:
                  type: array
                  items:
                    oneOf:
                      - $ref: "#/components/schemas/ResponsesFunctionTool"
                      - $ref: "#/components/schemas/ResponsesCustomTool"
                      - type: object
                        required: [type, name, tools]
                        additionalProperties: false
                        properties:
                          type: { type: string, enum: [namespace] }
                          name: { type: string, minLength: 1, maxLength: 64 }
                          description: { type: string }
                          tools:
                            type: array
                            minItems: 1
                            items:
                              oneOf:
                                - $ref: "#/components/schemas/ResponsesFunctionTool"
                                - $ref: "#/components/schemas/ResponsesCustomTool"
                      - type: object
                        required: [type]
                        additionalProperties: false
                        properties:
                          type: { type: string, enum: [web_search, web_search_preview] }
                          external_web_access: { type: boolean, default: true }
                          search_context_size: { type: string, enum: [low, medium, high] }
                tool_choice: { oneOf: [{ type: string }, { type: object }] }
                temperature: { type: number, minimum: 0, maximum: 2 }
                top_p: { type: number, minimum: 0, maximum: 1 }
                reasoning:
                  type: object
                  properties:
                    effort: { type: string, enum: [none, minimal, low, medium, high, xhigh] }
                    summary: { type: string, enum: [auto, concise, detailed] }
                  additionalProperties: false
                text:
                  type: object
                  properties:
                    verbosity: { type: string, enum: [low, medium, high] }
                    format:
                      oneOf:
                        - type: object
                          properties:
                            type: { type: string, enum: [text] }
                          required: [type]
                          additionalProperties: false
                        - type: object
                          properties:
                            type: { type: string, enum: [json_object] }
                          required: [type]
                          additionalProperties: false
                        - type: object
                          properties:
                            type: { type: string, enum: [json_schema] }
                            name: { type: string, minLength: 1 }
                            description: { type: string }
                            schema: { type: object, additionalProperties: true }
                            strict: { type: boolean }
                          required: [type, name, schema]
                          additionalProperties: false
                  additionalProperties: false
                metadata: { type: object, additionalProperties: { type: string } }
                client_metadata:
                  type: object
                  additionalProperties: { type: string }
                  description: Client diagnostics only; not forwarded upstream or used as policy authority.
                include:
                  type: array
                  items:
                    type: string
                    enum: [reasoning.encrypted_content, message.output_text.logprobs]
                truncation: { type: string, enum: [disabled] }
                background:
                  type: boolean
                  description: >-
                    True is not supported and returns 400; false is accepted.
                conversation:
                  description: Not supported; use previous_response_id instead.
                  nullable: true
                prompt:
                  description: Not supported; requests containing this property return 400.
              additionalProperties: false
      responses:
        "200":
          description: Responses API response, or semantic SSE events when `stream` is true.
          headers:
            x-request-id:
              description: Unique id for the Gateway audit log.
              schema: { type: string }
            x-provider:
              description: Upstream provider selected by Gateway routing.
              schema: { type: string }
            x-routed-model:
              description: Model selected by Gateway routing.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [id, object, status, model, output]
                properties:
                  id: { type: string }
                  object: { type: string, enum: [response] }
                  status: { type: string, enum: [completed, incomplete, failed] }
                  model: { type: string }
                  output: { type: array, items: { type: object, additionalProperties: true } }
                  usage: { type: object, additionalProperties: true }
            text/event-stream:
              schema:
                type: string
                description: Responses semantic SSE events, ending with response.completed, response.incomplete, or response.failed.
        "400":
          description: Invalid or unsupported Responses request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/cursor/chat/completions:
    post:
      tags: [Inference]
      summary: Create a chat completion (Cursor alias)
      description: |
        Labelled alias for `POST /v1/chat/completions`. Cursor's "Override OpenAI
        Base URL" already emits the OpenAI `/v1/chat/completions` shape, so point
        Cursor at `<gateway>/v1/cursor` for the same governed pipeline.
      operationId: createCursorChatCompletion
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/EndUserHeader"
        - $ref: "#/components/parameters/AgentIdHeader"
        - name: x-ryu-slot-chat-provider
          in: header
          required: false
          schema: { type: string }
        - name: x-ryu-slot-chat-model
          in: header
          required: false
          schema: { type: string }
        - name: x-ryu-session-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: A chat completion (or an SSE stream when `stream` is true).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/images/generations:
    post:
      tags: [Inference]
      summary: Create an image
      operationId: createImage
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/EndUserHeader"
        - $ref: "#/components/parameters/AgentIdHeader"
        - name: x-ryu-slot-image-provider
          in: header
          required: false
          schema: { type: string }
        - name: x-ryu-slot-image-model
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationRequest"
      responses:
        "200":
          description: Generated image(s).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/audio/speech:
    post:
      tags: [Inference]
      summary: Generate Audio
      operationId: createSpeech
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/EndUserHeader"
        - $ref: "#/components/parameters/AgentIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechRequest"
      responses:
        "200":
          description: >-
            Normalized audio envelope. Providers that answer with audio bytes
            (OpenAI) are returned inline as base64 under `b64_json`; job-based
            providers (fal, replicate) return a hosted `url` instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeechResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/audio/transcriptions:
    post:
      tags: [Inference]
      summary: Voice Recognition transcription
      operationId: createTranscription
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TranscriptionRequest"
      responses:
        "200":
          description: Transcribed text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                required: [text]
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/videos/generations:
    post:
      tags: [Inference]
      summary: Submit a video generation job
      description: >-
        Job-based video generation (cloud runs can take minutes). Returns `202`
        with `{ id, status }`; poll `GET /v1/videos/generations/{id}` for the
        result. Honors `x-ryu-slot-video-provider` / `x-ryu-slot-video-model`
        per-agent slot overrides. Reference media (first/last frames, a source
        clip, an audio track) travels inline as `data:` URIs in model-specific
        fields, so the request body may be up to 64 MiB. Every non-`data:` text
        field of the body, not only `prompt`, passes the inbound DLP scan.
      operationId: createVideoGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/videos/generations/{id}:
    get:
      tags: [Inference]
      summary: Poll a video generation job
      operationId: getVideoGeneration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current job status and, when succeeded, media payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/audio/generations:
    post:
      tags: [Inference]
      summary: Submit an audio generation job
      description: >-
        Job-based music and sound-effect generation (cloud runs can take
        minutes). Speech from text stays on `/v1/audio/speech`. Returns `202`
        with `{ id, status }`; poll `GET /v1/audio/generations/{id}` for the
        result. The body is `{ model, prompt, ... }` plus the model's own input
        fields, which queue-based providers (Fal, Replicate) receive unchanged;
        providers with a fixed video schema reject audio. Honors
        `x-ryu-slot-audio-provider` / `x-ryu-slot-audio-model` per-agent slot
        overrides. The body may be up to 64 MiB, and every non-`data:` text
        field passes the inbound DLP scan.
      operationId: createAudioGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                model: { type: string }
                prompt: { type: string }
              additionalProperties: true
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The request body exceeds the 64 MiB media-job limit.
  /v1/audio/generations/{id}:
    get:
      tags: [Inference]
      summary: Poll an audio generation job
      operationId: getAudioGeneration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Current job status and, when succeeded, `data: [{ url }]` with the
            generated audio.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/modalities:
    get:
      tags: [Models]
      summary: List configured modalities
      operationId: listModalities
      description: Requires a Gateway key when the Gateway enforces authentication.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Configured modality → provider/model mapping.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modalities:
                    type: array
                    items:
                      type: object
                      properties:
                        modality: { type: string, examples: [chat, image, tts, stt, video, audio] }
                        provider: { type: string }
                        model: { type: string }
                        configured: { type: boolean }
  /v1/models:
    get:
      tags: [Models]
      summary: List available models
      operationId: listModels
      description: Requires a Gateway key when the Gateway enforces authentication.
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: OpenAI-compatible model list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
  /v1/tools/composio:
    get:
      tags: [Tools]
      summary: List configured Composio actions
      operationId: listComposioTools
      responses:
        "200":
          description: Composio actions exposed as tools.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  composio_enabled: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        type: { type: string, const: composio }
                        description: { type: string }
  /v1/exec/tool:
    post:
      tags: [Tools]
      summary: Governed direct tool or code execution
      description: >-
        The gateway governance front for direct tool/code execution (#475).
        `kind` defaults to `tool` (forward to Core MCP `tools/call`); `execute`
        and `resume` forward to Core's PTC sandbox endpoints. Requires a
        trusted-forwarder or master API key; disabled when mesh mode is on.
        `agent_id` is required for Core's fail-closed agent scoping.
      operationId: execTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [tool, execute, resume]
                  default: tool
                tool_id: { type: string }
                arguments: { type: object, additionalProperties: true }
                code: { type: string }
                execution_id: { type: string }
                action: { type: string }
                content: { type: object, additionalProperties: true }
                request_id: { type: string }
                agent_id: { type: string }
                user_id: { type: string }
                session_id: { type: string }
                widget:
                  type: object
                  properties:
                    instance_id: { type: string }
                    origin_server: { type: string }
      responses:
        "200":
          description: Execution outcome from Core (governed forward).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  result: { type: object, additionalProperties: true }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/exec/scan:
    post:
      tags: [Tools]
      summary: Pre-exec command governance scan
      description: >-
        COMMAND-SCAN: scans a `backend` + `command` pair against the hardline
        blocklist and risk patterns. Returns `{ decision, reason, findings }`.
        Trusted-forwarder or master key only. Mode follows `RYU_EXEC_APPROVAL_MODE`.
      operationId: execScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: { type: string }
                command: { type: string }
                session_id: { type: string }
                agent: { type: string }
              required: [backend, command]
      responses:
        "200":
          description: Scan verdict.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    type: string
                    enum: [allow, deny, review]
                  reason: { type: string }
                  findings:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/evals:
    get:
      tags: [Evals]
      summary: Get eval configuration and provider scores (admin)
      description: Requires the master key (or a loopback peer in no-auth mode).
      operationId: getEvals
      responses:
        "200":
          description: Eval config plus rolling per-provider scores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  sample_rate: { type: number, format: float, minimum: 0, maximum: 1 }
                  max_latency_ms: { type: integer }
                  providers:
                    type: object
                    additionalProperties: { type: number, format: float }
                  online:
                    $ref: "#/components/schemas/OnlineEvalsSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/evals/online:
    get:
      tags: [Evals]
      summary: List online eval scores for production traffic (admin)
      description: >-
        Recent catalog-evaluator scores for sampled production requests, newest
        first, linked to the request id and (when tracing is on) the W3C trace
        id. Requires the master key (or a loopback peer in no-auth mode).
      operationId: getOnlineEvals
      parameters:
        - { name: request_id, in: query, required: false, schema: { type: string } }
        - { name: trace_id, in: query, required: false, schema: { type: string } }
        - { name: tenant, in: query, required: false, schema: { type: string } }
        - { name: agent_id, in: query, required: false, schema: { type: string } }
        - { name: evaluator, in: query, required: false, schema: { type: string } }
        - { name: failed_only, in: query, required: false, schema: { type: boolean } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Online eval configuration, counters, and matching records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  online:
                    $ref: "#/components/schemas/OnlineEvalsSummary"
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/OnlineEvalRecord"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/evals/run:
    post:
      tags: [Evals]
      summary: Run an eval dataset
      description: Runs a dataset (or the built-in 3-case set when omitted) through the pipeline and scores each case.
      operationId: runEvals
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRunRequest"
      responses:
        "200":
          description: Per-case scores and aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ScreeningUnavailable" }
  /v1/evals/score:
    post:
      tags: [Evals]
      summary: Score a completed output
      description: >-
        Scores an already-completed production response without replaying its
        provider call. Deterministic assertions run locally; model-graded
        assertions may make an explicit judge call through the normal pipeline.
      operationId: scoreOnline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnlineScoreRequest"
      responses:
        "200":
          description: Online score and per-assertion results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineScoreResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ScreeningUnavailable" }
  /v1/batches:
    post:
      tags: [Batch]
      summary: Submit an OpenRouter batch
      description: >-
        Requires the Gateway master key. Submits directly to the configured
        OpenRouter account; batch rows do not traverse the normal per-request
        Gateway routing, budget, firewall, or wallet settlement pipeline. The
        configured `data_collection: deny` and ZDR policies are enforced by
        refusing the submission because the Batch API does not document those
        request-level controls. A successful submission returns `202` while the
        provider validates and queues the job. `requests` must be last on the
        wire; the Gateway serializer preserves this ordering.
      operationId: createOpenRouterBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint, model, requests]
              properties:
                endpoint:
                  type: string
                  enum: [/v1/chat/completions, /v1/responses, /v1/messages, /v1/embeddings]
                model: { type: string, maxLength: 256 }
                completion_window: { type: string, enum: [24h] }
                provider:
                  type: object
                  additionalProperties: false
                  required: [only]
                  properties:
                    only:
                      type: array
                      minItems: 1
                      items: { type: string, maxLength: 128 }
                requests:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: object
                    additionalProperties: false
                    required: [custom_id, body]
                    properties:
                      custom_id: { type: string, minLength: 1, maxLength: 256 }
                      body:
                        type: object
                        additionalProperties: true
      responses:
        "202":
          description: Batch accepted for asynchronous validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenRouterBatch"
        "400":
          description: Invalid batch request or unsupported OpenRouter request shape.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "409":
          description: Gateway privacy or provider options cannot be enforced for batch requests.
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/ProviderError" }
    get:
      tags: [Batch]
      summary: List OpenRouter batches
      description: >-
        Requires the Gateway master key. Lists jobs in the configured
        OpenRouter workspace using cursor pagination; repeat `status` to include
        multiple values. Page size is limited to 100.
      operationId: listOpenRouterBatches
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: after
          in: query
          required: false
          description: Opaque cursor from the previous page's `last_id`.
          schema: { type: string }
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [validating, in_progress, completed, failed, expired, cancelled]
        - name: created_after
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: created_before
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Cursor-paginated batch metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenRouterBatchPage"
        "400": { description: Invalid list filter. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/ProviderError" }
  /v1/batches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: OpenRouter batch ID returned by the submit endpoint.
        schema: { type: string, pattern: "^batch_[A-Za-z0-9_-]+$" }
    get:
      tags: [Batch]
      summary: Poll an OpenRouter batch
      description: >-
        Requires the Gateway master key. Completed batches return their
        per-request results inline, correlated by `custom_id`.
      operationId: getOpenRouterBatch
      responses:
        "200":
          description: Current batch state and, on completion, inline results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenRouterBatch"
        "400": { description: Invalid batch ID. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Batch not found in the OpenRouter workspace. }
        "502": { $ref: "#/components/responses/ProviderError" }
    delete:
      tags: [Batch]
      summary: Delete a terminal OpenRouter batch
      description: >-
        Requires the Gateway master key. Deletes the batch and requests
        immediate removal of retained request and result artifacts. OpenRouter
        rejects deletion while a batch is still running; this endpoint does not
        cancel jobs.
      operationId: deleteOpenRouterBatch
      responses:
        "200":
          description: Batch record and applicable provider artifacts were deleted.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid batch ID. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Batch not found in the OpenRouter workspace. }
        "409": { description: Batch is still in progress. }
        "502": { $ref: "#/components/responses/ProviderError" }
  /v1/evaluators:
    get:
      tags: [Evals]
      summary: Get the shared evaluator catalog
      description: >-
        Returns the full unified evaluator catalog — the one taxonomy that powers
        both inline guardrails and offline evals. Each entry carries a
        `capabilities` gate ({ inline, offline }) selecting which surface may offer
        it and an `enforced` honesty flag (true only when wired to real execution).
        The built-in seed table is merged with any user-authored `custom_evaluators`
        from config (a custom entry overrides a built-in by `id` and reports
        `builtin: false`). Read-only; not behind the admin gate.
      operationId: getEvaluators
      security: []
      responses:
        "200":
          description: The shared evaluator catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluators:
                    type: array
                    items: { $ref: "#/components/schemas/Evaluator" }
  /v1/grants/validate:
    post:
      tags: [Governance]
      summary: Validate requested grants against policy
      operationId: validateGrants
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_id: { type: string }
                grants:
                  type: array
                  items: { type: string }
              required: [grants]
      responses:
        "200":
          description: Approved / denied grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved: { type: array, items: { type: string } }
                  denied: { type: array, items: { type: string } }
                  all_approved: { type: boolean }
  /v1/manifests/sign:
    post:
      tags: [Governance]
      summary: Sign a manifest (master key)
      description: Privileged ed25519 signing oracle. The caller must present the Gateway master key as the bearer, from any peer and in any mode (every require_auth Gateway, the Core-managed Gateway and the hosted fleet); a Gateway with no master key cannot sign. Cross-site browser requests are refused.
      operationId: signManifest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manifest: { type: object, additionalProperties: true }
              required: [manifest]
      responses:
        "200":
          description: Signature over the manifest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  algorithm: { type: string, const: ed25519 }
                  signature: { type: string, description: hex }
                  public_key: { type: string, description: base64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/manifests/verify:
    post:
      tags: [Governance]
      summary: Verify a manifest signature
      operationId: verifyManifest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manifest: { type: object, additionalProperties: true }
                signature: { type: string }
                public_key: { type: string }
              required: [manifest, signature]
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
  /v1/manifests/pubkey:
    get:
      tags: [Governance]
      summary: Get the gateway's public verifying key
      operationId: getManifestPubkey
      security: []
      responses:
        "200":
          description: The gateway ed25519 public key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  algorithm: { type: string, const: ed25519 }
                  public_key: { type: string, description: base64 }
  /v1/audit:
    get:
      tags: [Audit]
      summary: Query the usage audit log (admin)
      description: Requires the master key. Returns recorded model calls with token and cost accounting.
      operationId: queryAudit
      parameters:
        - { name: api_key, in: query, schema: { type: string } }
        - { name: org_id, in: query, schema: { type: string } }
        - { name: team_id, in: query, schema: { type: string } }
        - { name: project_id, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: errors_only, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: widget_instance_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Matching audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/audit/prune:
    post:
      tags: [Audit]
      summary: Apply local audit retention
      description: Owner-only maintenance pass using the configured retention bounds.
      operationId: pruneAudit
      responses:
        "200":
          description: Number of rows removed and active bounds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, const: retention }
                  deleted_rows: { type: integer }
                  retention_days: { type: integer, nullable: true }
                  max_rows: { type: integer, nullable: true }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/traffic:
    get:
      tags: [Audit]
      summary: Stream live request traffic (admin)
      description: |
        Server-Sent Events. Each event is framed `event: traffic` with an `id:` line holding
        the request id and a `data:` line holding one `TrafficEvent`. A new subscriber first
        receives a bounded tail of recent events, then live ones; a comment line every 15
        seconds keeps the connection open. One request can produce more than one event (a
        guardrail verdict, then its completion or failure), so deduplicate on `seq`, never on
        `request_id`.

        Requires the master key, or a loopback peer when auth is disabled. The master key
        sees every organization and may narrow the stream with `org`. Any other caller bound
        to an organization only ever receives that organization's events and is refused
        another one's. Events carry no prompt or response text, no full key and no end-user
        hash.
      operationId: streamTraffic
      parameters:
        - name: org
          in: query
          required: false
          description: Only stream events whose `org_id` is this organization id.
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: SSE stream of `TrafficEvent` objects (one per `data:` line).
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/TrafficEvent" }
        "400":
          description: The `org` parameter is not a valid organization id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            The caller may not read the feed, or asked for another organization's events
            (`error.type` is `policy_violation`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/exec/audit:
    post:
      tags: [Audit]
      summary: Ingest a sandbox execution event
      description: Trusted-forwarder or master key only.
      operationId: ingestExecAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: { type: string }
                command: { type: string }
                duration_ms: { type: integer }
                exit_code: { type: integer }
                session_id: { type: string }
                error: { type: string }
              required: [backend, command, duration_ms, exit_code]
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  exec_count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/exec/budget/check:
    post:
      tags: [Audit]
      summary: Pre-run sandbox execution budget gate
      operationId: checkExecBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: { type: string }
                command: { type: string }
              required: [backend, command]
      responses:
        "200":
          description: Whether the command is allowed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  reason: { type: string }
                  current_count: { type: integer }
                  max_count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sandbox/tick:
    post:
      tags: [Audit]
      summary: Meter one sandbox heartbeat
      description: |
        Core→Gateway control call (trusted-forwarder or master key only). Core
        posts one tick per sandbox run per heartbeat interval; the gateway accrues
        the marked-up cost, debits the org wallet, and returns a
        continue/warn/kill verdict. Not part of the standard OpenAI-compatible
        client surface — see [Loopback and internal routes](/docs/gateway/loopback-routes).
      operationId: sandboxTick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxTickRequest"
      responses:
        "200":
          description: Accrual snapshot and verdict for this tick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxTickResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sandbox/quote:
    post:
      tags: [Audit]
      summary: Quote a sandbox's hourly rate
      description: |
        Core→Gateway control call (trusted-forwarder or master key only). Core
        asks what a Box or sandbox of a given shape would be billed per hour
        before it starts one, so its credit pre-flight and the Gateway's ticks
        read the same rate table: the per-size Box rates when those are
        configured, otherwise the per-resource sandbox rates plus the sandbox
        markup. Not part of the standard OpenAI-compatible client surface — see
        [Loopback and internal routes](/docs/gateway/loopback-routes).
      operationId: sandboxQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxQuoteRequest"
      responses:
        "200":
          description: The hourly rate for this shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxQuoteResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sandbox/complete:
    post:
      tags: [Audit]
      summary: Complete a sandbox run
      description: |
        Core→Gateway control call (trusted-forwarder or master key only). Core
        sends it once it will never tick `run_id` again: after the final
        accounting of a normal completion, or after a kill verdict's provider
        teardown is confirmed. It removes the run's accrual and any sticky kill
        state, and is idempotent: a repeated or unknown completion answers
        `removed: false`. Not part of the standard OpenAI-compatible client
        surface — see [Loopback and internal routes](/docs/gateway/loopback-routes).
      operationId: sandboxComplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxCompleteRequest"
      responses:
        "200":
          description: Whether accrual state existed and was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCompleteResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/firewall/check:
    post:
      tags: [Security]
      summary: Run firewall guardrails over caller text
      description: >-
        Scans `text` for the requested guardrail names (e.g. `pii`, `jailbreak`,
        `toxicity`). Returns `{ allowed, reason }`. Read-only over caller data.
        Requires a Gateway API key when auth is on. Used by Core workflow
        Guardrails nodes.
      operationId: firewallCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                checks:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Verdict.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  reason: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/metrics:
    get:
      tags: [Health]
