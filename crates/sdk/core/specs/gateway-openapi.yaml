                  ok: { type: boolean }
                  providerAccountsApplied: { type: boolean, description: Live account settings were applied. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/channels/pairing/approve:
    post:
      tags: [Channels]
      summary: Approve a channel pairing code (admin)
      description: |
        Admits the direct-message sender who was given `code` by a channel bot under the default `pairing`
        policy. Pending codes are never written to the Gateway log, so the owner relays the code the sender
        received. Requires the master key (or a loopback peer in no-auth mode). A code is single use and
        expires after 24 hours. The response names the platform only, never the sender id or number.
      operationId: approveChannelPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
                  maxLength: 32
                  description: The pairing code the sender received. Case and surrounding spaces are ignored.
      responses:
        "200":
          description: The sender is paired and their next message is answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved: { type: boolean, const: true }
                  platform: { type: string, description: The channel the sender messaged from. }
        "400": { description: The code is empty or too long., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No pending sender holds that code (wrong, expired, or already approved)., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Channels have not started on this Gateway., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
