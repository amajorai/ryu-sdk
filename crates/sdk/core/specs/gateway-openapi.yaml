        "401": { $ref: "#/components/responses/AdminUnauthorized" }
  /v1/budget/spend:
    get:
      tags: [Audit]
      summary: Live budget spend (admin)
      description: Requires the master key, or a loopback caller when the Gateway runs without required auth. Per-user, per-agent and per-session charged spend with the configured caps, in micro-USD.
      operationId: getBudgetSpend
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Spend counters and limits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: object, additionalProperties: true }
                  agents: { type: object, additionalProperties: true }
                  sessions: { type: object, additionalProperties: true }
                  currency: { type: string, const: USD }
                  unit: { type: string, const: micro_usd }
                  limits: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }
  /v1/audit/usage:
    get:
      tags: [Audit]
      summary: Usage rollup (admin)
      description: Requires the master key, or a loopback caller when the Gateway runs without required auth, and an enabled audit log. Ranges may not exceed 400 days.
      operationId: queryAuditUsage
      parameters:
        - { name: from, in: query, required: true, description: Inclusive RFC 3339 lower bound., schema: { type: string, format: date-time } }
        - { name: until, in: query, required: true, description: Exclusive RFC 3339 upper bound., schema: { type: string, format: date-time } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
      responses:
        "200":
          description: Usage events rolled up by provider and model.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }
  /v1/doctor:
    get:
      tags: [Config]
      summary: Configuration doctor (admin)
      description: Requires the master key, or a loopback caller when the Gateway runs without required auth. A read-only report of configuration, security, and performance findings.
      operationId: getDoctor
      responses:
        "200":
          description: The doctor report.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/AdminUnauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key issued by the gateway, or the master key for admin endpoints.
    anthropicApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: The Gateway key, sent the way Anthropic clients send theirs (`/v1/messages` only).
    googApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: The Gateway key, sent the way Gemini clients send theirs (`/v1beta` only).
    googApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: The Gateway key as a `key` query parameter (`/v1beta` only).
  headers:
    RequestId:
      description: Gateway request id. Present on every response, errors included.
      schema: { type: string }
    RetryAfter:
      description: |
        Seconds to wait before retrying. On an inbound `rate_limit_exceeded` from
        the per-key request or burst limit, it is the time until that limiter
        admits another request. Other inbound refusals (organization limits,
        token-per-minute limits) send no `Retry-After`; back off on your own. On
        `provider_rate_limited` it is the provider's own value, when sent.
      schema: { type: integer, minimum: 0 }
    RateLimitPolicy:
      description: |
        IETF RateLimit-Policy (draft-ietf-httpapi-ratelimit-headers), for example
        `"requests";q=60;w=60` (per-key requests per minute) or `"burst";q=10;w=1`.
        Sent on an inbound `rate_limit_exceeded` when the per-key request or burst
        limiter refused, on every inference route.
      schema: { type: string }
    RateLimit:
      description: |
        IETF RateLimit, for example `"requests";r=0;t=1`: nothing remains and `t`
        seconds until the next request is admitted. Sent with RateLimit-Policy.
      schema: { type: string }
  parameters:
    UserIdHeader:
      name: x-ryu-user-id
      in: header
      required: false
      description: Per-user budget identity.
      schema: { type: string }
    EndUserHeader:
      name: x-ryu-end-user
      in: header
      required: false
      description: |
        Your own id for the end user behind this request: your internal id or a
        hash of it, never an email or phone number. 1 to 128 printable ASCII
        characters with no spaces, optionally prefixed `session:` for a
        logged-out visitor. The Gateway hashes it per organization and never
        stores or forwards the raw value. A malformed value is refused with
        `400`, `code: "invalid_end_user"`.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[!-~]+$" }
    AgentIdHeader:
      name: x-ryu-agent-id
      in: header
      required: false
      description: Per-agent budget identity.
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Caller is not permitted (admin/loopback only).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminUnauthorized:
      description: |
        Not the master key (`invalid_api_key`). A loopback caller is admitted
        without it only when the Gateway runs without required auth; a
        cross-site browser request or a non-loopback `Host` is refused even then.
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: |
        The request is invalid (`invalid_request_error`), for example a body that
        is not JSON.
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No route or resource matches (`not_found`).
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MethodNotAllowed:
      description: The path exists but not for this method (`method_not_allowed`).
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
        Allow:
          description: The methods the path accepts.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The request body is over the route's size limit (`request_too_large`).
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: |
        The body was sent without `Content-Type: application/json`
        (`invalid_request_error`).
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: |
        The body is JSON of the wrong shape, such as a missing required field or a
        field of the wrong type (`invalid_request_error`).
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GatewayTimeout:
      description: |
        The server-wide request timeout (300 seconds) passed before the response
        started (`gateway_timeout`). Use streaming for long generations.
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: |
        The Gateway's own inbound limit (`rate_limit_exceeded`) or the upstream
        provider's limit (`provider_rate_limited`) was reached.
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentRequired:
      description: OpenRouter account payment is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProviderError:
      description: |
        The upstream provider failed (`provider_error`). Upstream 4xx and 5xx
        answers both arrive as this 502; `error.upstream_status` carries the
        provider's status when it is known.
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ScreeningUnavailable:
      description: >-
        Request screening is temporarily unavailable (`error.code` is
        `screening_unavailable`), for example a hosted Gateway that holds no
        version of the Ryu platform policy. Retry after the `Retry-After` header.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ResponsesFunctionTool:
      type: object
      required: [type, name, parameters]
      additionalProperties: false
      properties:
        type: { type: string, enum: [function] }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string }
        parameters: { type: object, additionalProperties: true }
        strict: { type: boolean }
    ResponsesCustomTool:
      type: object
      required: [type, name]
      additionalProperties: false
      properties:
        type: { type: string, enum: [custom] }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string }
        format:
          oneOf:
            - type: object
              required: [type]
              additionalProperties: false
              properties:
                type: { type: string, enum: [text] }
            - type: object
              required: [type, syntax, definition]
              additionalProperties: false
              properties:
                type: { type: string, enum: [grammar] }
                syntax: { type: string, enum: [regex] }
                definition: { type: string, minLength: 1, maxLength: 16384 }
    ErrorCode:
      description: |
        Stable error code; `error.type` and `error.code` carry the same value.
        The enum lists the codes the Gateway's shared error path and router emit.
        Individual routes may add their own codes, so treat an unknown code as a
        generic failure for its HTTP status.
      anyOf:
        - type: string
          enum:
            - invalid_request_error
            - invalid_api_key
            - policy_violation
            - not_found
            - model_not_found
            - method_not_allowed
            - config_revision_conflict
            - request_too_large
            - budget_exceeded
            - insufficient_credits
            - provider_payment_required
            - rate_limit_exceeded
            - provider_rate_limited
            - internal_error
            - provider_error
            - circuit_open
            - engine_overloaded
            - credit_accounting_unavailable
            - all_providers_unavailable
            - gateway_timeout
        - type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { $ref: "#/components/schemas/ErrorCode" }
            code: { $ref: "#/components/schemas/ErrorCode" }
            upstream_status:
              type: integer
              minimum: 400
              maximum: 599
              description: |
                On `provider_error`, the HTTP status the upstream provider answered,
                when known. The Gateway's own status stays 502.
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait, on `rate_limit_exceeded` (per-key request or burst limit only) and `provider_rate_limited` (when the provider sent one).
            reset_at:
              type: integer
              description: On `provider_rate_limited`, the provider's reset time in Unix seconds, when sent.
        currentRevision:
          description: On `config_revision_conflict`, the configuration revision to refresh from.
    OpenRouterBatch:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, pattern: "^batch_[A-Za-z0-9_-]+$" }
        object: { type: string, const: batch }
        endpoint:
          type: string
          enum: [/v1/chat/completions, /v1/responses, /v1/messages, /v1/embeddings]
        model: { type: string }
        completion_window: { type: string, enum: [24h] }
        status:
          type: string
          enum: [validating, in_progress, finalizing, completed, failed, expired, cancelling, cancelled]
        created_at: { type: integer, description: Unix timestamp in seconds. }
        finalized_at: { type: integer, nullable: true, description: Unix timestamp in seconds. }
        request_counts:
          type: object
          properties:
            total: { type: integer }
            completed: { type: integer }
            failed: { type: integer }
        usage:
          type: object
          nullable: true
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
            cost: { type: number, format: double }
            is_byok: { type: boolean }
        results:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              custom_id: { type: string }
              response:
                type: object
                nullable: true
                properties:
                  status_code: { type: integer }
                  request_id: { type: string }
                  body: { type: object, additionalProperties: true }
              error: { type: object, nullable: true, additionalProperties: true }
        error: { type: object, nullable: true, additionalProperties: true }
      required: [id, endpoint, model, status]
    OpenRouterBatchPage:
      type: object
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/OpenRouterBatch" }
        first_id: { type: string, nullable: true }
        last_id: { type: string, nullable: true }
        has_more: { type: boolean }
      required: [data, has_more]
    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
      required: [role, content]
    ChatCompletionRequest:
      type: object
      properties:
        model: { type: string, description: Routed via the gateway model map. }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        stream: { type: boolean, default: false }
        temperature: { type: number, format: float }
        top_p: { type: number, format: float }
        max_tokens: { type: integer }
      required: [model, messages]
      additionalProperties: true
    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: "#/components/schemas/ChatMessage" }
              finish_reason: { type: string }
        usage: { $ref: "#/components/schemas/Usage" }
    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
    ImageGenerationRequest:
      type: object
      properties:
        model: { type: string }
        prompt: { type: string }
        "n": { type: integer, default: 1 }
        size: { type: string, examples: ["1024x1024"] }
        quality: { type: string, enum: [standard, hd] }
        response_format: { type: string, enum: [url, b64_json] }
      required: [prompt]
      additionalProperties: true
    ImageGenerationResponse:
      type: object
      properties:
        created: { type: integer }
        data:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              b64_json: { type: string }
    SpeechRequest:
      type: object
      properties:
        model: { type: string }
        input: { type: string }
        voice: { type: string, examples: [alloy] }
        response_format: { type: string, enum: [mp3, opus, aac, flac, wav, pcm] }
        speed: { type: number, format: float, minimum: 0.25, maximum: 4.0 }
      required: [model, input]
      additionalProperties: true
    SpeechResponse:
      type: object
      properties:
        object: { type: string, examples: [audio] }
        data:
          type: array
          items:
            type: object
            properties:
              b64_json:
                type: string
                description: Base64 audio bytes, when the provider returned audio inline.
              url:
                type: string
                description: Hosted audio URL, when the provider is job-based.
              content_type: { type: string, examples: [audio/wav] }
        raw:
          description: The provider's own payload when it answered in JSON.
          nullable: true
    TranscriptionRequest:
      type: object
      properties:
        file: { type: string, format: binary }
        model: { type: string }
        language: { type: string }
        prompt: { type: string }
        response_format: { type: string, enum: [json, text, vtt, srt] }
        temperature: { type: number, format: float }
      required: [file, model]
    ModelList:
      type: object
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              object: { type: string, const: model }
              created: { type: integer }
              owned_by: { type: string }
    EvalRunRequest:
      type: object
      properties:
        model:
          type: string
          description: >-
            Model under test. When omitted (and `models` is empty) the Gateway's
            `[evals].default_model`, then its pinned chat model, is used; with neither
            configured the request returns 400.
        models: { type: array, items: { type: string }, maxItems: 32 }
        agent_id: { type: string }
        judge_model: { type: string }
        system_prompt: { type: string }
        system_messages:
          type: array
          items: { $ref: "#/components/schemas/EvalMessage" }
        max_concurrency: { type: integer, minimum: 1, maximum: 32, default: 1 }
        timeout_ms: { type: integer, minimum: 100, maximum: 120000 }
        repeat: { type: integer, minimum: 1, maximum: 20, default: 1 }
        cache: { type: boolean, default: false }
        tags: { type: object, additionalProperties: { type: string } }
        prefix: { type: string }
        suffix: { type: string }
        prompt_id: { type: string }
        evaluators:
          type: array
          description: >-
            Optional run-level registry evaluator ids (from GET /v1/evaluators) to
            score every case against, in addition to any per-case `evaluators`.
            Empty/omitted preserves the assertion-only behavior.
          items: { type: string }
        dataset:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              description: { type: string }
              prompt: { type: string }
              expected: { type: string }
              context: { description: Optional reference/context payload for faithfulness and factuality checks. }
              provider: { type: string }
              providers: { type: array, items: { type: string } }
              provider_output: { description: Precomputed provider output; skips the provider call. }
              provider_output_provider: { type: string, description: Source label for a precomputed response. }
              provider_output_policy_pass: { type: boolean, description: Whether the external provider response is known to have cleared policy checks. Omit when unmeasured. }
              provider_latency_ms: { type: integer, minimum: 0, description: Externally measured operation turnaround in milliseconds. }
              provider_cost_micro_usd: { type: integer, minimum: 0, description: Provider-reported row cost in micro-USD. }
              vars: { type: object, additionalProperties: true }
              metadata: { type: object, additionalProperties: true }
              options: { type: object, additionalProperties: true }
              assertions:
                type: array
                items: { $ref: "#/components/schemas/EvalAssertion" }
              evaluators:
                type: array
                description: Per-case registry evaluator ids, unioned with the run-level set.
                items: { type: string }
            required: [prompt]
    EvalMessage:
      type: object
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
      required: [role, content]
    EvalAssertion:
      type: object
      properties:
        kind: { type: string }
        value: { type: string }
        rubric: { type: string }
        assertions:
          type: array
          items: { $ref: "#/components/schemas/EvalAssertion" }
        threshold: { type: number, format: float, minimum: 0, maximum: 1 }
        weight: { type: number, format: float, minimum: 0 }
        provider: { type: string }
        transform: { type: string }
        metric: { type: string }
        config: { type: object, additionalProperties: true }
        not: { type: boolean, description: Negate the assertion verdict and score. }
      required: [kind]
      additionalProperties: true
    OnlineEvalsSummary:
      type: object
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        sample_rate: { type: number, format: float, minimum: 0, maximum: 1 }
        evaluators: { type: array, items: { type: string } }
        judge_model: { type: string, nullable: true }
        max_judge_calls_per_minute: { type: integer }
        tenants: { type: array, items: { type: string } }
        stats:
          type: object
          properties:
            enqueued: { type: integer }
            droppedQueueFull: { type: integer }
            scored: { type: integer }
            judgeBudgetSkipped: { type: integer }
            stored: { type: integer }
    OnlineEvalRecord:
      type: object
      required: [requestId, tenant, model, provider, scores, pass, enqueuedAtMs, scoredAtMs]
      properties:
        requestId: { type: string }
        traceId: { type: string }
        tenant: { type: string }
        agentId: { type: string }
        model: { type: string }
        provider: { type: string }
        judgeModel: { type: string }
        pass: { type: boolean, description: Every executed evaluator passed. }
        enqueuedAtMs: { type: integer }
        scoredAtMs: { type: integer }
        scores:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              category: { type: string }
              score: { type: number, format: float }
              pass: { type: boolean }
              detail: { type: string }
              executed: { type: boolean }
    OnlineScoreRequest:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        agent_id: { type: string }
        model:
          type: string
          description: >-
            Model that produced `response`. When omitted the Gateway's configured
            default model is used. With none configured, deterministic-only scoring
            records the model as `unspecified`, and a request with a model-graded
            assertion or LLM-judge evaluator returns 400.
        judge_model:
          type: string
          description: >-
            Judge for model-graded checks. Defaults to `[evals].judge_model`, then
            `model`. An evaluator's own `offline.judgeModel` still takes precedence.
        prompt: { type: string }
        response: { description: Completed response or an OpenAI-shaped provider payload. }
        expected: { type: string }
        context: { description: Optional reference/context payload for faithfulness and factuality checks. }
        vars: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        latency_ms: { type: integer, minimum: 0 }
        policy_pass: { type: boolean, description: Optional externally measured policy result; omitted means unmeasured. }
        cost_micro_usd: { type: integer, minimum: 0 }
        threshold: { type: number, format: float, minimum: 0, maximum: 1 }
        assertions:
          type: array
          items: { $ref: "#/components/schemas/EvalAssertion" }
        evaluators: { type: array, items: { type: string } }
      required: [response]
    OnlineScoreResponse:
      type: object
      properties:
        kind: { type: string, const: online_score }
        scored_at: { type: string, format: date-time }
        score: { type: object, additionalProperties: true }
      required: [kind, scored_at, score]
    Evaluator:
      type: object
      description: >-
        One entry in the shared evaluator catalog. Struct fields serialize
        camelCase; the `impl` union is tagged on `kind`; category/target are
        snake_case enums.
      properties:
        id: { type: string, description: Stable snake_case id, e.g. "pii_leakage". }
        name: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [security, safety, quality, conversation, trajectory, image, voice, custom]
        target:
          type: string
          enum: [input, output, conversation, trajectory, image, audio]
        capabilities:
          type: object
          description: First-class gate selecting which surfaces may offer this evaluator.
          properties:
            inline: { type: boolean }
            offline: { type: boolean }
        impl:
          type: object
          description: How the judgment is computed (internally tagged on `kind`).
          properties:
            kind:
              type: string
              enum: [regex, heuristic, llm_judge, code, builtin]
        inline:
          type: object
          nullable: true
          description: Inline-guardrail config; present only when capabilities.inline.
          properties:
            action:
              type: string
              enum: [block, warn_and_continue, sanitize]
        offline:
          type: object
          nullable: true
          description: Offline-eval config; present only when capabilities.offline.
          properties:
            threshold: { type: number, format: float, minimum: 0, maximum: 1 }
            judgeModel: { type: string, nullable: true }
        builtin: { type: boolean, description: false for user-authored evaluators. }
        enforced:
          type: boolean
          description: Honesty flag; true only when wired to real execution.
        higherIsBetter:
          type: boolean
          description: Score polarity; false ⇒ a higher score is worse (negative-signal judge).
      required: [id, name, category, target, capabilities, impl, builtin, enforced]
    EvalRunResponse:
      type: object
      properties:
        cases:
          type: array
          items:
            type: object
            properties:
              prompt: { type: string }
              latency_ms: { type: integer }
              latency_available: { type: boolean, description: False when the source did not measure this latency. }
              token_efficiency: { type: number, format: float }
              policy_pass: { type: boolean }
              policy_available: { type: boolean, description: False when Gateway did not evaluate policy for a precomputed response. }
              substring_match: { type: boolean }
              score: { type: number, format: float }
        aggregate:
          type: object
          properties:
            avg_latency_ms: { type: number, format: float }
            latency_available_cases: { type: integer }
            avg_token_efficiency: { type: number, format: float }
            policy_pass_rate: { type: number, format: float }
            policy_available_cases: { type: integer }
            avg_score: { type: number, format: float }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        api_key: { type: string }
        request_id: { type: string }
        session_id: { type: string }
        org_id: { type: string }
        team_id: { type: string }
        project_id: { type: string }
        model: { type: string }
        provider: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_micro_usd: { type: integer, nullable: true }
        event_type: { type: string }
        feature: { type: string, nullable: true }
        managed_inference: { type: boolean }
        widget_instance_id: { type: string, nullable: true }
        error: { type: string }
    TrafficVerdict:
      type: object
      description: >-
        What the deciding layer did with the request. Names layers, detectors and catalogue
        codes only, never matched text, scores or segment paths.
      required: [decided_by, action, detector_ids, evaluator_ids, code]
      properties:
        decided_by:
          type: string
          enum: [platform_floor, node, org, agent, evaluator, inspector, rate_limit, budget, standing, none]
          description: The layer whose decision this is. `none` when no policy layer acted.
        action:
          type: string
          enum: [allow, warn, sanitize, block]
        detector_ids:
          type: array
          items: { type: string }
          description: >-
            Detection kinds, the organization's own pattern names or inspector categories. A
            Ryu platform policy decision names only the detection kind.
        evaluator_ids:
          type: array
          items: { type: string }
        code:
          type: string
          nullable: true
          description: The error catalogue `code` the client received, when the request failed.
    TrafficEvent:
      type: object
      description: >-
        One live traffic row. Fields after `ts` were added for the live policy map; older
        clients can ignore them.
      properties:
        request_id: { type: string }
        api_key: { type: string, description: The key prefix followed by `***`, never the full key. }
        provider: { type: string }
        model: { type: string, nullable: true }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_hit: { type: boolean }
        latency_ms: { type: integer }
        error:
          type: string
          nullable: true
          description: >-
            A redacted failure reason. For a decision by the Ryu platform policy, the
            inspector or an evaluator it is a fixed summary such as `blocked by inspector`.
        event_type: { type: string }
        session_id: { type: string, nullable: true }
        user_id: { type: string, nullable: true }
        agent_id: { type: string, nullable: true }
        managed_inference: { type: boolean }
        provider_cost_micro_usd: { type: integer, nullable: true }
        ts: { type: string, format: date-time }
        seq:
          type: integer
          format: int64
          description: Strictly increasing per Gateway process. Deduplicate on this.
        kind:
          type: string
          enum: [completion, verdict, cache_hit, failure]
        route:
          type: string
          nullable: true
          description: The matched route template, for example `/v1/chat/completions`.
        custody:
          type: string
          enum: [fleet, managed_node, self_hosted]
        credential_origin:
          type: string
          enum: [ryu_vault, ryu_fallback, node_operator, caller_subscription, local, unknown]
          description: >-
            Whose credential the request spent. `unknown` when the request was refused before
            a provider was chosen.
        org_id: { type: string, nullable: true }
        team_ids:
          type: array
          nullable: true
          items: { type: string }
        credential_id_prefix:
          type: string
          nullable: true
          description: The first characters of the hosted credential id, followed by `***`.
        status:
          type: integer
          nullable: true
          description: HTTP status returned to the client. Null on a `verdict` row.
        verdict: { $ref: "#/components/schemas/TrafficVerdict" }
        stage_latency_ms:
          type: object
          properties:
            screen:
              type: integer
              nullable: true
              description: Milliseconds spent in the checks before dispatch.
            upstream:
              type: integer
              nullable: true
              description: Milliseconds from the end of screening to the end of the request.
    CommunitySavings:
      type: object
      description: Anonymous aggregate compression, cache, and Gateway protection counters.
      properties:
        requests: { type: integer, format: int64 }
        api_calls_protected: { type: integer, format: int64 }
        malicious_calls_blocked: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        tokens_saved: { type: integer, format: int64 }
        cache_hit_rate: { type: number, format: double }
      required: [requests, api_calls_protected, malicious_calls_blocked, input_tokens, output_tokens, tokens_saved, cache_hit_rate]
    SandboxSpec:
      type: object
      description: Provisioned sandbox resources being billed for this tick.
      properties:
        vcpu: { type: integer, minimum: 0 }
        mem_gib: { type: integer, minimum: 0 }
        storage_gib: { type: integer, minimum: 0 }
        gpu:
          type: string
          enum: [none, h200, h100, rtx_pro_6000, rtx_5090, rtx_4090]
        gpu_count: { type: integer, minimum: 0, default: 0 }
        os:
          type: string
          enum: [linux, windows]
      required: [vcpu, mem_gib, storage_gib, gpu, os]
    SandboxSize:
      type: string
      description: The Box size a session or cloud-task Box was created with.
      enum: [small, default, large]
    SandboxQuoteRequest:
      type: object
      properties:
        spec: { $ref: "#/components/schemas/SandboxSpec" }
        size:
          oneOf:
            - $ref: "#/components/schemas/SandboxSize"
            - type: "null"
          description: The Box size, for a session or cloud-task Box. When set and size rates are configured, the quote is that size's hourly rate.
      required: [spec]
    SandboxCompleteRequest:
      type: object
      properties:
        run_id: { type: string, description: Sandbox run identifier whose accrual state Core no longer needs. }
      required: [run_id]
    SandboxCompleteResponse:
      type: object
      properties:
        run_id: { type: string, description: Echo of the completed run. }
        removed:
          type: boolean
          description: Whether accrual state existed and was removed. `false` on a repeated or unknown completion.
      required: [run_id, removed]
    SandboxQuoteResponse:
      type: object
      properties:
        rate_micro_usd_per_hour:
          type: integer
          minimum: 0
          description: The customer rate a run of this shape would be billed at, in micro-USD per hour, from this Gateway's own rate table.
      required: [rate_micro_usd_per_hour]
    SandboxTickRequest:
      type: object
      properties:
        run_id: { type: string, description: Sandbox run identifier; the accrual key. }
        org_id:
          type: string
          nullable: true
          description: Org whose wallet is debited. Omitted when Core cannot resolve an org.
        spec: { $ref: "#/components/schemas/SandboxSpec" }
        elapsed_seconds_delta:
          type: integer
          minimum: 0
          description: Seconds elapsed since Core's previous tick for this run.
        tick_index:
          type: integer
          minimum: 0
          description: Monotonic tick counter from 0; guards against double-accrual on retry.
        per_run_budget_micro_usd:
          type: integer
          minimum: 0
          default: 0
          description: Per-run execution cap in micro-USD. `0` means no cap.
      required: [run_id, spec, elapsed_seconds_delta, tick_index]
    SandboxVerdict:
      type: string
      enum: [continue, warn, kill_budget, kill_balance]
    SandboxTickResponse:
      type: object
      properties:
        accrued_micro_usd:
          type: integer
          description: Cumulative billed (marked-up) micro-USD accrued for this run.
        balance_micro_usd:
          type: integer
          nullable: true
          description: Authoritative wallet balance after the debit, or null when unknown.
        verdict: { $ref: "#/components/schemas/SandboxVerdict" }
      required: [accrued_micro_usd, verdict]
    ProviderPoolStrategy:
      type: string
      description: Canonical provider/model pool policy; weighted_round_robin is retained for compatibility. Use the node's advertised capabilities.
      enum: [priority, weighted, round_robin, context_relay, fill_first, p2c, random, least_used, cost_optimized, reset_aware, reset_window, headroom, strict_random, auto, lkgp, context_optimized, cache_optimized, fusion, pipeline, quota_weighted, weighted_round_robin]
    PoolExecutionConfig:
      type: object
      additionalProperties: false
      description: Bounded fusion/pipeline execution. Total timeout must be at least the per-target timeout; at most eight targets may be enabled.
      properties:
        leg_timeout_ms: { type: integer, minimum: 1, maximum: 30000, default: 30000 }
        total_timeout_ms: { type: integer, minimum: 1, maximum: 120000, default: 120000 }
        max_output_bytes: { type: integer, minimum: 1, maximum: 262144, default: 262144 }
        quorum: { type: integer, minimum: 1, maximum: 8, default: 2 }
        grace_ms: { type: integer, minimum: 0, maximum: 5000, default: 250 }
    AutoScoringWeights:
      type: object
      nullable: true
      additionalProperties: false
      description: Optional Auto ranking coefficients. Absent config uses the pinned full defaults; omitted fields in a partial object are zero. All supplied values must be finite, 0–1000, with a positive total.
      properties:
        quota: { type: number, minimum: 0, maximum: 1000 }
        health: { type: number, minimum: 0, maximum: 1000 }
        cost_inv: { type: number, minimum: 0, maximum: 1000 }
        latency_inv: { type: number, minimum: 0, maximum: 1000 }
        task_fit: { type: number, minimum: 0, maximum: 1000 }
        stability: { type: number, minimum: 0, maximum: 1000 }
        tier_priority: { type: number, minimum: 0, maximum: 1000 }
        tier_affinity: { type: number, minimum: 0, maximum: 1000 }
        specificity_match: { type: number, minimum: 0, maximum: 1000 }
        context_affinity: { type: number, minimum: 0, maximum: 1000 }
        cache_affinity: { type: number, minimum: 0, maximum: 1000 }
        session_availability: { type: number, minimum: 0, maximum: 1000 }
        reset_window_affinity: { type: number, minimum: 0, maximum: 1000 }
        connection_density: { type: number, minimum: 0, maximum: 1000 }
        quality: { type: number, minimum: 0, maximum: 1000 }
        reliability: { type: number, minimum: 0, maximum: 1000 }
    ProviderPoolConfig:
      type: object
      required: [members]
      properties:
        strategy: { $ref: '#/components/schemas/ProviderPoolStrategy' }
        sticky_limit: { type: integer, minimum: 1, maximum: 100, default: 1 }
        wait_for_cooldown_ms: { type: integer, minimum: 0, maximum: 30000, default: 0 }
        execution: { $ref: '#/components/schemas/PoolExecutionConfig' }
        auto_weights: { $ref: '#/components/schemas/AutoScoringWeights' }
        judge:
          type: object
          nullable: true
          additionalProperties: false
          required: [provider, model]
          description: Required for fusion. A configured concrete chat target; pool aliases are not permitted.
          properties:
            provider: { type: string }
            model: { type: string, minLength: 1, maxLength: 256 }
        members:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            required: [provider, model]
            properties:
              provider: { type: string }
              model: { type: string }
              priority: { type: integer, minimum: 0, maximum: 255, default: 0 }
              weight: { type: integer, minimum: 0, maximum: 65535, default: 1 }
              enabled: { type: boolean, default: true }
              last_resort: { type: boolean, default: false }
              context_tokens: { type: integer, nullable: true, minimum: 1, maximum: 2000000 }
    GatewayConfig:
      type: object
      description: Firewall, budgets, providers, auth, and routing config. Secrets are redacted on read.
      properties:
        strategyCapabilities:
          type: object
          readOnly: true
          required: [chat, web]
          description: Supported strategy wires for chat and web. Older nodes omit this field. Web excludes chat-only execution/context/cache policies.
          properties:
            chat:
              type: array
              items: { $ref: '#/components/schemas/ProviderPoolStrategy' }
            web:
              type: array
              items: { $ref: '#/components/schemas/ProviderPoolStrategy' }
        providerAccountPolicies:
          type: object
          writeOnly: true
          description: Merge complete account settings by provider and opaque account ID; 1–128 accounts per update. Applied live without a restart.
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              required: [name, enabled, priority]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                enabled: { type: boolean }
                priority: { type: integer, minimum: 0, maximum: 65535 }
        providerAccountStrategies:
          type: object
          writeOnly: true
          description: Merge new-session API-key account routing by provider. Supported keys are openai, anthropic, and openrouter; applies live after provider reload.
          additionalProperties:
            type: string
            enum: [round_robin, quota_first, fill_first, reset_first]
        firewall: { type: object, additionalProperties: true }
        budgets: { type: object, additionalProperties: true }
        providers: { type: object, additionalProperties: true }
        auth:
          type: object
          properties:
            require_auth: { type: boolean }
            api_keys:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  key: { type: string }
                  trusted_forwarder: { type: boolean }
                  org_id: { type: string }
                  team_id: { type: string }
        routing:
          type: object
          properties:
            provider_pools:
              type: object
              additionalProperties: { $ref: '#/components/schemas/ProviderPoolConfig' }
            default_provider: { type: string }
            model_map: { type: object, additionalProperties: true }
            fallback_chain:
              type: array
              items: { type: string }
