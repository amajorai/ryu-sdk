[project]
name = "ryu-sdk"
version = "0.5.0"
description = "Ryu developer SDK for Python: agents, tools, structured output, workflows, and Core clients, plus the UniFFI binding to the shared Rust kernel."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "A Major Pte. Ltd." }]
keywords = ["ryu", "sdk", "uniffi", "agents", "gateway", "workflows", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
]
# The pure-Python authoring surface (Agent, tools, workflows, Core clients)
# speaks HTTP through httpx. pydantic is optional: install the `pydantic` extra
# to use pydantic models as tool arguments and structured outputs.
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
pydantic = ["pydantic>=2.4.0,<3"]
# pytest 9.0.3 fixes GHSA-6w46-j5rx-g56g (tmpdir handling) but requires Python >=3.10; the
# Python 3.9 floor of this package keeps the last pytest 7/8 line (no patched 3.9 release exists).
test = [
  "pytest>=9.0.3; python_version >= '3.10'",
  "pytest>=7; python_version < '3.10'",
  "pydantic>=2.4.0,<3",
  "mypy>=1.8",
]
# `[tool.ruff]` selects no rules, so `ruff check` runs the installed ruff's default rule set;
# the pin keeps that set fixed. tests/test_pyproject_ruff.py runs `ruff check` on
# ryu_sdk/services and tests when this exact version is installed. Bump it deliberately and fix
# (or justify) whatever new findings the new defaults raise.
lint = ["ruff==0.17.1"]

[project.urls]
Homepage = "https://ryuhq.com"
Documentation = "https://docs.ryuhq.com/docs/extend/develop/sdk/language-bindings"
Repository = "https://github.com/amajorai/ryu-sdk"

# The native module `ryu_sdk/ryu_sdk.py` is GENERATED, not committed: the CI job
# (.github/workflows/sdk-bindings.yml) builds the cdylib, runs
# `uniffi-bindgen generate --library ... --language python --out-dir ryu_sdk`,
# and copies the matching compiled library alongside the generated module. The
# generated module and libraries are gitignored; the package `__init__.py` and
# the pure-Python modules beside it are committed. See
# docs/multi-language-bindings-spec.md.
[tool.hatch.build.targets.wheel]
packages = ["ryu_sdk"]
artifacts = [
  "ryu_sdk/*.py",
  "ryu_sdk/*.so",
  "ryu_sdk/*.dylib",
  "ryu_sdk/*.dll",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# `ruff format --check .` (run from bindings/python) passes with this config.
# 120 columns matches the existing hand-written modules; target-version follows
# requires-python so ruff never emits syntax newer than Python 3.9.
[tool.ruff]
line-length = 120
target-version = "py39"
# Temporary: these files are authored by the open pure-Python Agent PR (#792)
# or predate this config. They are left unformatted so #792 follow-ups rebase
# without format-only conflicts; drop each entry once it is reformatted after
# #792 merges. README.md is excluded because ruff formats its code fences.
extend-exclude = [
    "README.md",
    "test_sdk.py",
    "ryu_sdk/agent.py",
    "ryu_sdk/managed_agents.py",
    "ryu_sdk/middleware.py",
    "ryu_sdk/model_call.py",
    "ryu_sdk/schema.py",
    "ryu_sdk/workflow.py",
    "tests/helpers.py",
    "tests/test_agent.py",
    "tests/test_harness.py",
    "tests/test_managed_agents.py",
    "tests/test_schema_tools.py",
    "tests/test_workflow.py",
]

[tool.ruff.lint.pyupgrade]
# Keep `Optional[X]` / `Union[X, Y]`: requires-python is 3.9, where `typing.get_type_hints`
# (ryu_sdk.schema, and readers' own introspection of the services' TypedDicts and functions)
# evaluates annotations and cannot evaluate `X | None`. PEP 585 builtins (`dict[str, Any]`) work
# on 3.9 and stay enforced (UP006/UP035).
keep-runtime-typing = true

# `mypy --strict ryu_sdk` runs clean, also in a native-built tree. The generated
# UniFFI module is absent from a source checkout and, when present (test.sh and
# CI write it before pytest), is machine-written and not annotated: `exclude`
# keeps it out of the sources mypy collects when it walks the package directory,
# and the override treats it as an untyped dependency (its imports are `Any`)
# whose own errors are never reported.
[tool.mypy]
exclude = ['ryu_sdk/ryu_sdk\.py$']

[[tool.mypy.overrides]]
module = ["ryu_sdk.ryu_sdk"]
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
