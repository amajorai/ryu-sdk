name: Publish SDK

# The hub rides the Ryu release train. Dispatch this workflow at a mirrored
# source version; it never creates a second automatic version stream.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Ryu release tag to publish, for example v0.2.4"
        required: true
        type: string
      publish:
        description: "Publish to npm and crates.io after verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify selected SDK version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: |
          VERSION="$(node -e 'process.stdout.write(require("./packages/sdk/package.json").version)')"
          test "${{ inputs.tag }}" = "v${VERSION}" || {
            echo "tag ${{ inputs.tag }} does not match SDK version v${VERSION}" >&2
            exit 1
          }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:native
      - run: bun run check
      - run: mvn --batch-mode test -f bindings/java/pom.xml
      # Dependent crates carry both a local path and their crates.io version.
      # `cargo package` validates that version against the public index before
      # the publish job has released the dependency chain, so packaging ryu-sdk
      # here would fail on every new train. Local checks prove the standalone
      # source graph; publish-crates packages and publishes in dependency order.
      - run: cargo package --locked --manifest-path crates/core/kernel-contracts/Cargo.toml
      - run: cargo check --locked --manifest-path crates/sdk/core/Cargo.toml
      - run: cargo check --locked --manifest-path crates/sdk/ffi/Cargo.toml
      - run: cargo check --locked --manifest-path crates/sdk/uniffi/Cargo.toml

  native-build:
    name: Build NAPI (${{ matrix.target }})
    needs: verify
    if: inputs.publish == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun x napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: napi-${{ matrix.target }}
          path: crates/sdk/napi/*.node
          if-no-files-found: error

  publish-native:
    name: Publish @ryuhq/sdk-native
    needs: native-build
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      NPM_ENABLED: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require npm credentials
        if: env.NPM_ENABLED != 'true'
        run: |
          echo "NPM_TOKEN is required when publish=true" >&2
          exit 1
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: napi-*
          path: crates/sdk/napi
          merge-multiple: true
      - name: Publish native package
        working-directory: crates/sdk/napi
        run: bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm:
    name: Publish JavaScript packages
    needs: [verify, publish-native]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      NPM_ENABLED: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require npm credentials
        if: env.NPM_ENABLED != 'true'
        run: |
          echo "NPM_TOKEN is required when publish=true" >&2
          exit 1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Configure npm auth after build
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
      - name: Publish JavaScript packages
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for package in packages/protocol packages/client packages/core-client packages/sdk packages/create-ryu-app; do
            (cd "$package" && bun publish --access public)
          done

  publish-crates:
    name: Publish Rust crates
    needs: verify
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      CARGO_ENABLED: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Require crates.io credentials
        if: env.CARGO_ENABLED != 'true'
        run: |
          echo "CARGO_REGISTRY_TOKEN is required when publish=true" >&2
          exit 1
      - name: Publish crates after credential-free verification
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for manifest in \
            crates/core/kernel-contracts/Cargo.toml \
            crates/sdk/core/Cargo.toml \
            crates/sdk/ffi/Cargo.toml \
            crates/sdk/uniffi/Cargo.toml; do
            attempt=1
            while true; do
              if output="$(cargo publish --locked --no-verify --manifest-path "$manifest" --token "$CARGO_REGISTRY_TOKEN" 2>&1)"; then
                printf '%s\n' "$output"
                break
              fi
              printf '%s\n' "$output" >&2
              if printf '%s\n' "$output" | grep -qiE 'already (exists|uploaded)|is already uploaded'; then
                echo "$manifest is already published at this version; continuing"
                break
              fi
              if [ "$attempt" -ge 8 ] || ! printf '%s\n' "$output" | grep -qiE 'rate limit|429|too many requests'; then
                exit 1
              fi
              echo "crates.io rate limit; waiting 65 seconds before retry $((attempt + 1))/8"
              sleep 65
              attempt=$((attempt + 1))
            done
            sleep 65
          done
