name: Publish SDK

# The hub rides the Ryu release train. Dispatch this workflow at a mirrored
# source version; it never creates a second automatic version stream.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Ryu release tag to publish, for example v0.3.0"
        required: true
        type: string
      publish:
        description: "Publish every configured SDK registry after verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify selected SDK version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: |
          VERSION="$(node -e 'process.stdout.write(require("./packages/sdk/package.json").version)')"
          test "${{ inputs.tag }}" = "v${VERSION}" || {
            echo "tag ${{ inputs.tag }} does not match SDK version v${VERSION}" >&2
            exit 1
          }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:native
      # @ryuhq/sdk imports the client package's published declaration entrypoint;
      # build it before the workspace type-check so a clean hub checkout has dist.
      - run: bun run build:client
      - run: bun run check
      - run: mvn --batch-mode test -f bindings/java/pom.xml
      - run: bash bindings/python/test.sh
      - name: Install C# binding generator
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --rev 3264197034c028e6c7502159607daf9f238b72c5
      - run: bash bindings/csharp/test.sh
      # Dependent crates carry both a local path and their crates.io version.
      # `cargo package` validates that version against the public index before
      # the publish job has released the dependency chain, so packaging ryu-sdk
      # here would fail on every new train. Local checks prove the standalone
      # source graph; publish-crates packages and publishes in dependency order.
      - run: cargo package --locked --manifest-path crates/core/kernel-contracts/Cargo.toml
      - run: cargo check --locked --manifest-path crates/sdk/core/Cargo.toml
      - run: cargo check --locked --manifest-path crates/sdk/ffi/Cargo.toml
      - run: cargo check --locked --manifest-path crates/sdk/uniffi/Cargo.toml

  python-build:
    name: Build Python wheel (${{ matrix.rid }})
    needs: verify
    if: inputs.publish == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            rid: linux-x64
            platform: linux_x86_64
          - host: macos-13
            rid: osx-x64
            platform: macosx_10_13_x86_64
          - host: macos-14
            rid: osx-arm64
            platform: macosx_11_0_arm64
          - host: windows-latest
            rid: win-x64
            platform: win_amd64
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Build and package native Python binding
        run: bash bindings/python/build-package.sh "$RUNNER_TEMP/python-dist"
        shell: bash
        env:
          RYU_PYTHON_PLATFORM_TAG: ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-${{ matrix.rid }}
          path: ${{ runner.temp }}/python-dist/*.whl
          if-no-files-found: error

  csharp-build:
    name: Build C# native asset (${{ matrix.rid }})
    needs: verify
    if: inputs.publish == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            rid: linux-x64
          - host: macos-13
            rid: osx-x64
          - host: macos-14
            rid: osx-arm64
          - host: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install C# binding generator
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --rev 3264197034c028e6c7502159607daf9f238b72c5
      - name: Generate C# binding and stage native asset
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) lib_name="libryu_sdk_uniffi.dylib" ;;
            MINGW*|MSYS*|CYGWIN*) lib_name="ryu_sdk_uniffi.dll" ;;
            *) lib_name="libryu_sdk_uniffi.so" ;;
          esac
          cargo build --release --manifest-path crates/sdk/uniffi/Cargo.toml
          lib_path="target/release/$lib_name"
          uniffi-bindgen-cs \
            --library "$lib_path" \
            --config bindings/csharp/uniffi.csharp.toml \
            --out-dir bindings/csharp
          output="$RUNNER_TEMP/csharp-${{ matrix.rid }}"
          mkdir -p "$output/runtimes/${{ matrix.rid }}/native"
          cp "$lib_path" "$output/runtimes/${{ matrix.rid }}/native/"
          if [ "${{ matrix.rid }}" = "linux-x64" ]; then
            cp bindings/csharp/ryu_sdk.cs "$output/ryu_sdk.cs"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: csharp-${{ matrix.rid }}
          path: ${{ runner.temp }}/csharp-${{ matrix.rid }}
          if-no-files-found: error

  csharp-package:
    name: Pack Ryu.Sdk NuGet package
    needs: csharp-build
    if: inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: csharp-*
          path: bindings/csharp
          merge-multiple: true
      - name: Pack NuGet artifact
        run: |
          set -euo pipefail
          test -f bindings/csharp/ryu_sdk.cs
          dotnet pack bindings/csharp/Ryu.Sdk.csproj --configuration Release --output "$RUNNER_TEMP/nuget"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-package
          path: ${{ runner.temp }}/nuget/Ryu.Sdk.*.nupkg
          if-no-files-found: error

  publish-pypi:
    name: Publish ryu-sdk to PyPI
    needs: python-build
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      PYPI_ENABLED: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Require PyPI credentials
        if: env.PYPI_ENABLED != 'true'
        run: |
          echo "PYPI_API_TOKEN is required when publish=true" >&2
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-*
          path: "$RUNNER_TEMP/python-dist"
          merge-multiple: true
      - name: Install upload tooling before exposing the token
        run: python -m pip install --disable-pip-version-check --quiet twine
      - name: Upload Python wheels
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: >-
          python -m twine upload --non-interactive --skip-existing
          --repository-url https://upload.pypi.org/legacy/
          --username __token__ --password "$PYPI_API_TOKEN"
          "$RUNNER_TEMP"/python-dist/*.whl

  publish-nuget:
    name: Publish Ryu.Sdk to NuGet
    needs: csharp-package
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      NUGET_ENABLED: ${{ secrets.NUGET_API_KEY != '' }}
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Require NuGet credentials
        if: env.NUGET_ENABLED != 'true'
        run: |
          echo "NUGET_API_KEY is required when publish=true" >&2
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nuget-package
          path: "$RUNNER_TEMP/nuget"
      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "$RUNNER_TEMP"/nuget/Ryu.Sdk.*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-maven:
    name: Publish com.ryu:ryu-client to Maven Central
    needs: verify
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      MAVEN_ENABLED: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && secrets.MAVEN_CENTRAL_TOKEN != '' && secrets.MAVEN_GPG_PRIVATE_KEY != '' && secrets.MAVEN_GPG_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Require Maven Central credentials
        if: env.MAVEN_ENABLED != 'true'
        run: |
          echo "MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_TOKEN, MAVEN_GPG_PRIVATE_KEY, and MAVEN_GPG_PASSPHRASE are required when publish=true" >&2
          exit 1
      - name: Skip an already published immutable version
        id: registry
        run: |
          version="$(awk '/<artifactId>ryu-client<\/artifactId>/{seen=1} seen && /<version>/{gsub(/.*<version>|<\/version>.*/, ""); print; exit}' bindings/java/pom.xml)"
          if curl --fail --silent --show-error "https://repo1.maven.org/maven2/com/ryu/ryu-client/${version}/ryu-client-${version}.pom" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "com.ryu:ryu-client:${version} is already on Maven Central"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import signing key
        if: steps.registry.outputs.already != 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Write Maven Central settings
        if: steps.registry.outputs.already != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Publish signed Java artifact
        if: steps.registry.outputs.already != 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          --settings "$RUNNER_TEMP/settings.xml"
          -f bindings/java/pom.xml -Prelease deploy
          -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"

  native-build:
    name: Build NAPI (${{ matrix.target }})
    needs: verify
    if: inputs.publish == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build NAPI addon
        working-directory: crates/sdk/napi
        run: bun run build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: napi-${{ matrix.target }}
          path: crates/sdk/napi/*.node
          if-no-files-found: error

  publish-native:
    name: Publish @ryuhq/sdk-native
    needs: native-build
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      NPM_ENABLED: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require npm credentials
        if: env.NPM_ENABLED != 'true'
        run: |
          echo "NPM_TOKEN is required when publish=true" >&2
          exit 1
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: napi-*
          path: crates/sdk/napi
          merge-multiple: true
      - name: Configure npm auth after build
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
      - name: Publish native package
        working-directory: crates/sdk/napi
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if npm view "@ryuhq/sdk-native@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@ryuhq/sdk-native@${version} is already published; continuing"
          else
            bun publish --access public
          fi
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm:
    name: Publish JavaScript packages
    needs: [verify, publish-native]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      NPM_ENABLED: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require npm credentials
        if: env.NPM_ENABLED != 'true'
        run: |
          echo "NPM_TOKEN is required when publish=true" >&2
          exit 1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Configure npm auth after build
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/.npmrc"
      - name: Publish JavaScript packages
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for package in packages/protocol packages/client packages/core-client packages/sdk packages/create-ryu-app; do
            (cd "$package" && bun publish --access public)
          done

  publish-crates:
    name: Publish Rust crates
    needs: verify
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: release
    env:
      CARGO_ENABLED: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Require crates.io credentials
        if: env.CARGO_ENABLED != 'true'
        run: |
          echo "CARGO_REGISTRY_TOKEN is required when publish=true" >&2
          exit 1
      - name: Publish crates after credential-free verification
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for manifest in \
            crates/core/kernel-contracts/Cargo.toml \
            crates/sdk/core/Cargo.toml \
            crates/sdk/ffi/Cargo.toml \
            crates/sdk/uniffi/Cargo.toml; do
            attempt=1
            while true; do
              if output="$(cargo publish --locked --no-verify --manifest-path "$manifest" --token "$CARGO_REGISTRY_TOKEN" 2>&1)"; then
                printf '%s\n' "$output"
                break
              fi
              printf '%s\n' "$output" >&2
              if printf '%s\n' "$output" | grep -qiE 'already (exists|uploaded)|is already uploaded'; then
                echo "$manifest is already published at this version; continuing"
                break
              fi
              if [ "$attempt" -ge 8 ] || ! printf '%s\n' "$output" | grep -qiE 'rate limit|429|too many requests'; then
                exit 1
              fi
              echo "crates.io rate limit; waiting 65 seconds before retry $((attempt + 1))/8"
              sleep 65
              attempt=$((attempt + 1))
            done
            sleep 65
          done
